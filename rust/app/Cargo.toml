[package]
name = "aria2c"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `aria2c`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "aria2c"
path = "src/main.rs"

[dependencies]
clap = "4"
uri-parse-rs = { path = "../uri-parse/port" }
sha1 = "0.10"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
axum = "0.8"
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }

[workspace]
