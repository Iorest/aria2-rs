[package]
name = "aria2c"
version = "0.1.0"
edition = "2024"
publish = false
description = "Front door for `aria2c`, generated by rust-anything: Rust owns the entry point, the original answers what is not ported yet"

[[bin]]
name = "aria2c"
path = "src/main.rs"

[dependencies]
clap = "4"
uri-parse-rs = { path = "../uri-parse/port" }

