name: replay

on:
  push:
    branches: [main]
  pull_request:

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN: >-
        env/aria2-1.37.0/bin/aria2c --no-conf --dir=downloads
        --allow-overwrite=true --auto-file-renaming=false
        --all-proxy=http://127.0.0.1:9 --no-proxy=127.0.0.1,localhost
        --max-tries=1 --retry-wait=0
        --ca-certificate=test-env/certs/ca.crt
    steps:
      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint libtool \
            pkg-config gettext python3-pip libssl-dev libexpat1-dev lsof curl
          python3 -m pip install --break-system-packages pyftpdlib cryptography

      - name: Install rust-anything 4.2.0 (pinned by docs/RECORD-CASES.md)
        run: cargo install rust-anything --version 4.2.0 --locked

      - name: Build pinned original aria2 1.37.0
        run: |
          TARBALL=aria2-1.37.0.tar.xz
          curl -fL --retry 3 -o "$TARBALL" \
            https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0.tar.xz
          echo '60a420ad7085eb616cb6e2bdf0a7206d68ff3d37fb5a956dc44242eb2f79b66b  aria2-1.37.0.tar.xz' | sha256sum -c -
          mkdir -p env/tarball
          tar xf "$TARBALL" -C env/tarball
          cd env/tarball/aria2-1.37.0
          ./configure --prefix="$PWD/../../aria2-1.37.0" \
            --with-openssl --without-appletls --without-gnutls --without-libxml2 \
            --disable-nls
          make -j"$(nproc)" && make install
          sha256sum ../../aria2-1.37.0/bin/aria2c

      - name: Prepare fixtures and loopback servers
        run: |
          test-env/setup.sh
          test-env/serve.sh start
          test-env/serve.sh check

      - name: G0 - network and credential boundary
        run: |
          if grep -rnE '(https?|ftp)://' rust/app-cases rpc-cases/rust/app-cases cases \
             | grep -vE '127\.0\.0\.1|localhost'; then
            echo 'FAIL: non-loopback URI'; exit 1
          fi
          if grep -rnE 'creds\.json|BEGIN [A-Z ]*PRIVATE KEY' \
             rust/app-cases rpc-cases/rust/app-cases cases; then
            echo 'FAIL: credential leak'; exit 1
          fi

      - name: Build Rust front door
        run: cargo build --manifest-path rust/app/Cargo.toml

      - name: G1 positive HTTPS/FTP coverage
        run: |
          for case in man-11-https-single man-12-https-multi \
                      man-13-ftp-single man-14-ftp-secret man-04-http-ftp; do
            grep -q 'status.code = 0' "rust/app-cases/$case.toml"
            test -d "rust/app-cases/$case.out"
          done

      - name: G1 - original replay 100%
        run: rust-anything app replay . --build "test-env/replay-home.sh $RUN"

      - name: G2 - front-door replay 100%, fallback below baseline
        run: rust-anything app replay . --build "test-env/replay-home.sh rust/app/target/debug/aria2c"

      - name: G1 - RPC original replay 100%
        run: rust-anything app replay rpc-cases

      - name: G2 - RPC front-door replay, zero fallback
        run: rust-anything app replay rpc-cases --build "../test-env/replay-home.sh ../rust/app/target/debug/aria2c"

      - name: G4 - combined fallback below stage-2 baseline 42.7%
        run: |
          cli_fb=$(sed -n 's/^Fallback rate: [0-9.]*% (\([0-9]*\)\/[0-9]*.*/\1/p' rust/app-cases/replay-report.md)
          rpc_fb=$(sed -n 's/^Fallback rate: [0-9.]*% (\([0-9]*\)\/[0-9]*.*/\1/p' rpc-cases/rust/app-cases/replay-report.md)
          cli_total=$(sed -n 's/^Fallback rate: [0-9.]*% ([0-9]*\/\([0-9]*\).*/\1/p' rust/app-cases/replay-report.md)
          rpc_total=$(sed -n 's/^Fallback rate: [0-9.]*% ([0-9]*\/\([0-9]*\).*/\1/p' rpc-cases/rust/app-cases/replay-report.md)
          for value in "$cli_fb" "$rpc_fb" "$cli_total" "$rpc_total"; do
            case "$value" in ''|*[!0-9]*) echo 'FAIL: missing fallback counts in replay reports'; exit 1 ;; esac
          done
          echo "CLI fallback=$cli_fb/$cli_total, RPC fallback=$rpc_fb/$rpc_total"
          awk -v fb="$((cli_fb + rpc_fb))" -v total="$((cli_total + rpc_total))" 'BEGIN {
            rate = 100 * fb / total
            printf "combined fallback=%.1f%% (%d/%d)\n", rate, fb, total
            if (rate >= 42.7) exit 1
          }'

      - name: GID mapping comparator (EQUIVALENCE N1)
        run: python3 test-env/check-gid-consistency.py rust/app/target/debug/aria2c

      - name: G3 - replay report zero drift
        run: git diff --exit-code -- rust/app-cases rpc-cases/rust/app-cases

      - name: Dump replay diff on failure
        if: failure()
        run: cat rust/app-cases/replay-report.md rpc-cases/rust/app-cases/replay-report.md || true

      - name: Stop loopback servers
        if: always()
        run: test-env/serve.sh stop
