[request]
method = "POST"
path = "/rpc"
body = '<?xml version="1.0"?><methodCall><methodName>aria2.getGlobalStat</methodName><params><param><value><string>token:local-rpc-test-only</string></value></param></params></methodCall>'

[request.headers]
